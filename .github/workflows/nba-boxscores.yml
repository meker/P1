name: NBA box scores

# Reads last night's box scores from NBA.com (ESPN where NBA.com fails) every 30 minutes
# while US evening games finish, and commits them under data/raw/<date>/ in the daily
# report's raw format. The morning report job clones this repo instead of fetching
# Basketball-Reference, which posts box scores up to a day late.
on:
  schedule:
    - cron: "0,30 1-9 * * *"  # 01:00-09:30 UTC = 04:00-12:30 Turkey time (UTC+3)
  push:  # a change to the fetcher runs it once right away (data commits don't match these paths)
    paths:
      - "nba_boxscores/**"
      - ".github/workflows/nba-boxscores.yml"
  workflow_dispatch:
    inputs:
      dates:
        description: "US game dates, comma separated YYYY-MM-DD (empty = last night and the night before)"
        required: false
        default: ""
      refetch:
        description: "Read final games again even if already saved"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nba-boxscores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # the branch head, not the commit the run was started from

      - name: Fetch box scores and commit new data
        env:
          DATES: ${{ inputs.dates }}
          REFETCH: ${{ inputs.refetch && '--refetch' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            : > "$RUNNER_TEMP/summary.txt"
            python3 nba_boxscores/fetch.py --out data/raw --summary "$RUNNER_TEMP/summary.txt" --debug $REFETCH ${DATES:+--dates "$DATES"}
            git add data
            if git diff --cached --quiet; then
              echo "No new data."
              exit 0
            fi
            { echo "data: $(head -n1 "$RUNNER_TEMP/summary.txt")"; echo; cat "$RUNNER_TEMP/summary.txt"; } > "$RUNNER_TEMP/msg.txt"
            git commit -q -F "$RUNNER_TEMP/msg.txt"
            if git push -q; then
              cat "$RUNNER_TEMP/summary.txt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The branch moved meanwhile: fetching again on top of it."
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
          done
          exit 1
