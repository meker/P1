name: Probe NBA.com endpoints (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe www.nba.com page data
        shell: python3 {0}
        run: |
          import json, re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          def page(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "text/html", "Accept-Language": "en-US,en;q=0.9"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode("utf-8", "replace")
                  print("GET", url, "->", r.status, r.geturl(), len(html))
              m = re.search(r'<script id="__NEXT_DATA__" type="application/json"[^>]*>(.*?)</script>', html, re.S)
              return json.loads(m.group(1)) if m else None
          def walk(o, path="", depth=0, out=None):
              out = [] if out is None else out
              if depth > 6: return out
              if isinstance(o, dict):
                  for k, v in o.items():
                      p = f"{path}.{k}"
                      if isinstance(v, (dict, list)): out.append(f"{p} {type(v).__name__}({len(v)})"); walk(v, p, depth + 1, out)
              elif isinstance(o, list) and o:
                  walk(o[0], path + "[0]", depth + 1, out)
              return out
          d = page("https://www.nba.com/games?date=2026-10-23")
          ids = sorted(set(re.findall(r'"gameId":\s*"(\d{10})"', json.dumps(d)))) if d else []
          md = d["props"]["pageProps"]["gameCardFeed"]["modules"][0]["moduleData"]
          print("moduleData keys:", list(md.keys()))
          cards = md.get("cards") or []
          print("cards:", len(cards), "card0:", json.dumps(cards[0])[:1500] if cards else None)
          print("games page gameIds:", ids)
          if ids:
              b = page(f"https://www.nba.com/game/{ids[0]}/box-score")
              if b:
                  pp = b["props"]["pageProps"]
                  print("box pageProps keys:", list(pp.keys()))
                  g = pp.get("game") or {}
                  print("game keys:", list(g.keys())[:40])
                  for side in ("awayTeam", "homeTeam"):
                      t = g.get(side) or {}
                      print(side, t.get("teamTricode"), "players", len(t.get("players", [])), "stat keys", sorted((t.get("statistics") or {}).keys())[:70])
                      if t.get("players"):
                          print("  player0", json.dumps(t["players"][0])[:900])
