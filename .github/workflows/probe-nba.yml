name: Probe NBA.com endpoints (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe www.nba.com page data
        shell: python3 {0}
        run: |
          import json, re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          def page(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "text/html", "Accept-Language": "en-US,en;q=0.9"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode("utf-8", "replace")
              m = re.search(r'<script id="__NEXT_DATA__" type="application/json"[^>]*>(.*?)</script>', html, re.S)
              return json.loads(m.group(1))["props"]["pageProps"]
          def find(o, path=""):
              if isinstance(o, dict):
                  if "gameId" in o and ("homeTeam" in o or "awayTeam" in o):
                      yield path, o
                  for k, v in o.items():
                      yield from find(v, f"{path}.{k}")
              elif isinstance(o, list):
                  for i, v in enumerate(o):
                      yield from find(v, f"{path}[{i}]")
          pp = page("https://www.nba.com/games?date=2026-10-23")
          hits = list(find(pp))
          print("game dicts:", len(hits))
          for path, g in hits[:2]:
              print(path, json.dumps({k: g[k] for k in g if k not in ("broadcasters",)})[:1600])
          print("paths:", sorted({re.sub(r"\[\d+\]", "[]", p) for p, _ in hits}))
          gid = hits[0][1]["gameId"]
          b = page(f"https://www.nba.com/game/{gid}/box-score")
          g = b["game"]
          print("game keys:", list(g.keys()))
          print("status:", g.get("gameStatus"), g.get("gameStatusText"), g.get("period"), g.get("gameCode"), g.get("gameEt"))
          for side in ("awayTeam", "homeTeam"):
              t = g[side]
              print(side, "keys:", [k for k in t.keys() if k != "players"])
              print("  statistics:", json.dumps(t.get("statistics")))
              for p in t["players"]:
                  s = p.get("statistics") or {}
                  print("  ", p.get("firstName"), p.get("familyName"), "| pos", repr(p.get("position")), "| comment", repr(p.get("comment")), "| min", repr(s.get("minutes")), "| pts", s.get("points"), "| keys", sorted(set(p.keys()) - {"statistics"}))
          for k in ("homeTeamPlayers", "awayTeamPlayers", "inactivePlayers", "inactives"):
              if k in g: print(k, json.dumps(g[k])[:600])
          print("boxscoreParams:", json.dumps(b.get("boxscoreParams"))[:300])
